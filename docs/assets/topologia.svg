<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Topología del laboratorio DHCP, SNMP y Zabbix</title>
  <desc id="d">R1 conectado a SW1; SW1 conectado a SW2 y al servidor Zabbix; SW2 conectado a una PC. Red 10.7.1.0/24.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060912"/>
      <stop offset="1" stop-color="#130A28"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#00E5FF" stroke-opacity="0.06"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#10B981" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1100" height="700" fill="url(#bg)"/>
  <rect width="1100" height="700" fill="url(#grid)"/>

  <text x="40" y="52" font-family="'Segoe UI', Arial, sans-serif" font-size="24" font-weight="700" fill="#E6ECFF">Topología · DHCP, SNMP y Zabbix</text>
  <text x="40" y="78" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#7F8AB0">LAN 10.7.1.0/24 · VLAN 1 · SNMPv2c de solo lectura</text>

  <!-- enlaces -->
  <g fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M550 124 V210" stroke="#00E5FF"/>
    <path d="M440 252 H210 V390" stroke="#FF2BD6"/>
    <path d="M660 252 H890 V390" stroke="#FF2BD6"/>
    <path d="M210 474 V570" stroke="#7C3AED"/>
  </g>

  <!-- consulta SNMP desde Zabbix -->
  <path d="M760 432 H550 V298" fill="none" stroke="#10B981" stroke-width="2.2" stroke-dasharray="8 7" stroke-linecap="round" marker-end="url(#arrow)" filter="url(#glow)"/>
  <text x="566" y="420" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#10B981">SNMP GET · UDP/161</text>

  <!-- puertos -->
  <g font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#C9D1E8">
    <text x="560" y="140">f0/0</text>
    <text x="560" y="204">Gi0/0</text>
    <text x="420" y="244" text-anchor="end">Gi0/1</text>
    <text x="218" y="380">Gi0/0</text>
    <text x="680" y="244">Gi0/2</text>
    <text x="898" y="380">e0</text>
    <text x="218" y="494">Gi0/1</text>
    <text x="218" y="562">e0</text>
  </g>

  <!-- R1 -->
  <g filter="url(#glow)"><rect x="440" y="40" width="220" height="84" rx="14" fill="#0F1424" stroke="#00E5FF" stroke-width="2"/></g>
  <text x="550" y="70" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#E6ECFF">R1</text>
  <text x="550" y="92" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#9AA7D0">Cisco 2691 · IOS 12.4</text>
  <text x="550" y="112" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#00E5FF">10.7.1.1/24 · DHCP · SNMP</text>

  <!-- SW1 -->
  <g filter="url(#glow)"><rect x="440" y="210" width="220" height="84" rx="14" fill="#0F1424" stroke="#FF2BD6" stroke-width="2"/></g>
  <text x="550" y="240" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#E6ECFF">SW1</text>
  <text x="550" y="262" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#9AA7D0">vIOS-L2 · 15.2</text>
  <text x="550" y="282" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#FF2BD6">VLAN 1 · 10.7.1.2/24</text>

  <!-- SW2 -->
  <g filter="url(#glow)"><rect x="100" y="390" width="220" height="84" rx="14" fill="#0F1424" stroke="#FF2BD6" stroke-width="2"/></g>
  <text x="210" y="420" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#E6ECFF">SW2</text>
  <text x="210" y="442" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#9AA7D0">vIOS-L2 · 15.2</text>
  <text x="210" y="462" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#FF2BD6">VLAN 1 · 10.7.1.3/24</text>

  <!-- Zabbix -->
  <g filter="url(#glow)"><rect x="760" y="390" width="260" height="84" rx="14" fill="#0F1424" stroke="#10B981" stroke-width="2"/></g>
  <text x="890" y="420" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#E6ECFF">Servidor Zabbix</text>
  <text x="890" y="442" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#9AA7D0">Ubuntu Server 24.04 · Zabbix 7.0 LTS</text>
  <text x="890" y="462" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#10B981">ens33 · cliente DHCP</text>

  <!-- PC -->
  <g filter="url(#glow)"><rect x="100" y="570" width="220" height="84" rx="14" fill="#0F1424" stroke="#7C3AED" stroke-width="2"/></g>
  <text x="210" y="600" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#E6ECFF">PC (Windows)</text>
  <text x="210" y="622" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#9AA7D0">Navegador · interfaz web</text>
  <text x="210" y="642" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#A78BFA">10.7.1.20/24 · IP fija</text>

  <!-- leyenda -->
  <g transform="translate(640 540)" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#C9D1E8">
    <rect width="400" height="120" rx="12" fill="#0F1424" stroke="#2A3358"/>
    <text x="20" y="28" fill="#E6ECFF" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="14">Leyenda</text>
    <line x1="20" y1="48" x2="60" y2="48" stroke="#00E5FF" stroke-width="3"/>
    <text x="72" y="52">Enlace router ↔ switch</text>
    <line x1="20" y1="72" x2="60" y2="72" stroke="#FF2BD6" stroke-width="3"/>
    <text x="72" y="76">Enlaces entre switches y servidor</text>
    <line x1="20" y1="96" x2="60" y2="96" stroke="#10B981" stroke-width="2.2" stroke-dasharray="8 7"/>
    <text x="72" y="100">Consulta SNMP de Zabbix a R1, SW1 y SW2</text>
  </g>
</svg>
