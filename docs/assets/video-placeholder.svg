<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Video demostrativo · DHCP, SNMP y Zabbix</title>
  <desc id="d">Miniatura del video demostrativo del laboratorio</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060912"/>
      <stop offset="0.6" stop-color="#150A2C"/>
      <stop offset="1" stop-color="#050B1A"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF"/>
      <stop offset="1" stop-color="#FF2BD6"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#00E5FF" stroke-opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="1280" height="520" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="520" rx="18" fill="url(#grid)"/>
  <rect x="3" y="3" width="1274" height="514" rx="16" fill="none" stroke="url(#neon)" stroke-width="3"/>

  <!-- botón de reproducción -->
  <g filter="url(#glow)">
    <circle cx="640" cy="220" r="86" fill="#0F1424" stroke="url(#neon)" stroke-width="5"/>
    <path d="M612 172 L612 268 L694 220 Z" fill="url(#neon)"/>
  </g>

  <text x="640" y="372" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="38" font-weight="800" fill="#E6ECFF">Video demostrativo</text>
  <text x="640" y="414" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="22" fill="#9AA7D0">DHCP · SNMP de solo lectura · Zabbix</text>
  <text x="640" y="462" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="16" letter-spacing="3" fill="#00E5FF">CLIC PARA VER EL VIDEO</text>
</svg>
