<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="80" viewBox="0 0 600 80">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Fondo oscuro -->
  <rect width="600" height="80" rx="10" fill="#0d0914" stroke="#00e5ff" stroke-width="2" filter="url(#glow)"/>
  
  <!-- Línea base decorativa -->
  <line x1="50" y1="70" x2="550" y2="70" stroke="#ff00ff" stroke-width="1" opacity="0.5" />

  <!-- Texto en movimiento -->
  <text y="45" font-family="'Courier New', monospace" font-size="20" font-weight="bold" fill="#ffffff" filter="url(#glow)">
    <tspan>
      ✨ Autora: Lisbeth Gómez · Matrícula 2025-0701 ✨
      <animate attributeName="x" values="600; -600" dur="8s" repeatCount="indefinite" />
    </tspan>
  </text>
</svg>