<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Laboratorio de Redes: DHCP, SNMP y Zabbix</title>
  <desc id="d">Banner del laboratorio: router Cisco con DHCP, SNMP de solo lectura y monitoreo con Zabbix</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060912"/>
      <stop offset="0.55" stop-color="#130A28"/>
      <stop offset="1" stop-color="#050B1A"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF"/>
      <stop offset="0.55" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#FF2BD6"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#00E5FF" stroke-opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>

  <!-- red decorativa -->
  <g fill="none" stroke="#00E5FF" stroke-opacity="0.55" stroke-width="1.6" filter="url(#glow)">
    <path d="M880 70 L980 150 L1090 90 M980 150 L950 250 M980 150 L1100 220 M1090 90 L1150 170 M1100 220 L1150 170"/>
  </g>
  <g filter="url(#glow)">
    <circle cx="880" cy="70" r="7" fill="#00E5FF"/>
    <circle cx="980" cy="150" r="13" fill="#FF2BD6"/>
    <circle cx="1090" cy="90" r="8" fill="#00E5FF"/>
    <circle cx="950" cy="250" r="8" fill="#10B981"/>
    <circle cx="1100" cy="220" r="10" fill="#7C3AED"/>
    <circle cx="1150" cy="170" r="6" fill="#00E5FF"/>
  </g>

  <text x="60" y="82" font-family="Consolas, 'Courier New', monospace" font-size="18" letter-spacing="6" fill="#00E5FF">// LABORATORIO DE REDES</text>
  <text x="58" y="170" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="70" font-weight="800" fill="url(#neon)" filter="url(#glow)">DHCP · SNMP · ZABBIX</text>
  <text x="60" y="218" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#C9D1E8">Monitoreo de un router y dos switches Cisco con SNMPv2c de solo lectura</text>
  <text x="60" y="270" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#7F8AB0">Lisbeth Gómez · Matrícula 2025-0701 · Red 10.7.1.0/24</text>

  <rect x="0" y="312" width="1200" height="8" fill="url(#neon)"/>
</svg>
